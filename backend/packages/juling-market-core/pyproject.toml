[project]
name = "juling-market-core"
version = "0.1.0"
description = "剧灵 market source tools and endpoint definition validator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "jsonpath-rfc9535>=1.0.0",
    "jsonschema>=4.26.0",
    "packaging>=24.0",
    "Pillow>=12.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juling_market_core"]
